<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mobile sheet fixture</title>
<style>
  /* Headless Chrome clamps its viewport to 500px, so a phone width cannot be
     captured directly. `#phone` is exactly 390x844 and carries a transform,
     which makes it the containing block for the sheet's position:fixed — so the
     sheet lays out at phone width inside it. The capture is cropped to this box.
     Harness only; nothing here ships. */
  html, body { margin: 0; height: 100%; background: #6b7280; }
  #phone {
    width: 390px; height: 844px; margin: 0 auto; position: relative;
    overflow: hidden; transform: translateZ(0);
    background: #fff;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #111318;
  }
  .bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid #e9ebee; }
  .dot { width: 26px; height: 26px; border-radius: 7px; background: #1f6feb; }
  .bar strong { font-size: .95rem; }
  .page { padding: 16px; }
  .page h1 { font-size: 1.15rem; margin: 0 0 4px; }
  .page p { color: #5f6672; font-size: .85rem; margin: 0 0 16px; }
  .block { height: 74px; border: 1px solid #e9ebee; border-radius: 10px; margin-bottom: 10px; }
  @media (prefers-color-scheme: dark) {
    html, body { background: #000; }
    #phone { background: #101113; color: #e8e8ea; }
    .bar, .block { border-color: #24262a; }
    .page p { color: #a1a5ad; }
  }
</style>
<div id="phone">
  <div class="bar"><span class="dot"></span><strong>NST&#39;25 CS+AI</strong></div>
  <div class="page">
    <h1>Your performance</h1>
    <p>Lectures, assignments, quizzes</p>
    <div class="block"></div><div class="block"></div><div class="block"></div>
  </div>
</div>

<script>
  // The bundle reads this instead of the portal API when it runs on localhost.
  window.__NST_MOBILE_FIXTURE = [
    { name: 'ADA - B', held: 12, attended: 12 },
    { name: 'ADA Lab 2 - B', held: 10, attended: 9 },
    { name: 'AP - B', held: 12, attended: 10 },
    { name: 'AP Lab 2 - B', held: 10, attended: 8 },
    { name: 'DE - B', held: 11, attended: 11 },
    { name: 'DE Lab 2 - B', held: 11, attended: 11 },
    { name: 'LHL - B', held: 0, attended: 0 },
    { name: 'Maths III - B', held: 12, attended: 9 },
    { name: 'Maths III Lab 2 - B', held: 10, attended: 6 },
  ];
  // Pin the demo settings so captures are reproducible.
  localStorage.setItem('nst-attendance:settings', JSON.stringify({
    targetPercent: 75,
    overrides: {},
    schedule: { enabled: true, weeks: 12, perWeek: 4, perSubject: { lhl: { weeks: 10, perWeek: 1 } } },
  }));
</script>
<script src="/docs/nst-mobile.js"></script>
<script>
  // The sheet attaches itself to <html>; move it inside the phone frame so the
  // transform above contains it. The bundle is a blocking script, so by the
  // time this runs the host usually exists already — poll rather than observe.
  (function move() {
    const host = document.getElementById('nst-mobile-sheet');
    if (host) {
      document.getElementById('phone').append(host);
      return;
    }
    requestAnimationFrame(move);
  })();
</script>
